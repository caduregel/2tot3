<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Buitenste cirkel -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#333333" stroke-width="3"/>
    
    <!-- Doel/precisie cirkels -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="#555555" stroke-width="2"/>
    <circle cx="50" cy="50" r="25" fill="none" stroke="#777777" stroke-width="2"/>
    
    <!-- Kruis voor precisie/focus -->
    <line x1="50" y1="15" x2="50" y2="85" stroke="#333333" stroke-width="2"/>
    <line x1="15" y1="50" x2="85" y2="50" stroke="#333333" stroke-width="2"/>
    
    <!-- Kleine cirkels op de kruispunten voor balans -->
    <circle cx="50" cy="15" r="3" fill="#333333"/>
    <circle cx="50" cy="85" r="3" fill="#333333"/>
    <circle cx="15" cy="50" r="3" fill="#333333"/>
    <circle cx="85" cy="50" r="3" fill="#333333"/>
    
    <!-- Centrale cirkel voor focus -->
    <circle cx="50" cy="50" r="8" fill="#333333"/>
</svg>
